<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码访问 · Java面试宝典</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#0d0d1a;color:#e0e0e0;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:#fff;border-radius:16px;padding:32px 24px;text-align:center;max-width:380px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.card h2{color:#1a1a2e;font-size:20px;margin-bottom:6px}
.card>p{color:#888;font-size:13px;margin-bottom:18px}
.qr-wrap{display:flex;justify-content:center;gap:20px;margin-bottom:16px;flex-wrap:wrap}
.qr-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.qr-item img{width:150px;height:150px;border-radius:8px;border:1px solid #eee}
.qr-item span{font-size:11px;color:#999}
.url-box{background:#f5f5f5;border-radius:8px;padding:10px 14px;font-size:12px;color:#555;word-break:break-all;font-family:Consolas,monospace;margin-bottom:12px}
.copy-btn{display:inline-flex;align-items:center;gap:6px;background:#c9a96e;color:#fff;border:none;padding:8px 24px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .2s}
.copy-btn:hover{opacity:.85}
.toast{color:#2e7d32;font-size:12px;margin-top:8px;display:none}
.footer{margin-top:20px;font-size:12px;color:#aaa;line-height:1.8}
.footer a{color:#c9a96e;text-decoration:none}
.tip{background:#faf5ed;border-radius:8px;padding:10px 14px;font-size:12px;color:#8a7a5a;margin-top:14px;text-align:left}
</style>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1a1a2e">
</head>
<body>
<div class="card">
  <h2>Java 面试宝典</h2>
  <p>手机 / 平板扫一扫，多端同步刷题</p>

  <div class="qr-wrap">
    <div class="qr-item">
      <img src="qrcode_lan.png" alt="局域网二维码" onerror="this.style.display='none'">
      <span>手机 / 平板扫这个</span>
    </div>
  </div>

  <div class="url-box" id="urlText"></div>
  <button class="copy-btn" onclick="copyUrl()">📋 复制链接</button>
  <div class="toast" id="toast">已复制！</div>

  <div class="tip">
    <strong>注意：</strong>手机和电脑需连接 <strong>同一个 WiFi</strong>。如果换过网络，请重新运行 <code>python 生成二维码.py</code> 更新二维码。
  </div>

  <div class="footer">
    <a href="Java面试宝典_总目录.html">电脑端直接打开 →</a>
  </div>
</div>

<script>
const lanUrl = 'http://192.168.5.171:9876/Java面试宝典_总目录.html';
document.getElementById('urlText').textContent = lanUrl;

function copyUrl() {
  navigator.clipboard.writeText(lanUrl).then(() => {
    const t = document.getElementById('toast');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
  });
}
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js')}</script>
</body>
</html>
